name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install tshark (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark || sudo DEBIAN_FRONTEND=noninteractive apt-get install -y wireshark-common
          # Ubuntu 26 AppArmor confines tshark to /tmp. Drop that profile so file
          # reads in the checkout are tested directly; the process runner also
          # retries from /tmp when the profile is still loaded.
          if [ -f /etc/apparmor.d/tshark ]; then
            sudo apparmor_parser -R /etc/apparmor.d/tshark || true
          fi
          if [ -f /etc/apparmor.d/usr.bin.tshark ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.bin.tshark || true
          fi

      - name: Install tshark (macOS)
        if: runner.os == 'macOS'
        run: brew install wireshark || true

      - name: Install tshark (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          winget install --id WiresharkFoundation.Wireshark --exact --scope machine --accept-package-agreements --accept-source-agreements --disable-interactivity
          $dir = "C:\Program Files\Wireshark"
          if (-not (Test-Path "$dir\tshark.exe")) {
            throw "tshark.exe was not installed at $dir"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          & "$dir\tshark.exe" -v

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: PTY render and Ctrl-C smoke test
        if: runner.os == 'Linux'
        run: python3 tests/pty_smoke.py

      - name: Optimized build
        run: zig build -Doptimize=ReleaseSafe
